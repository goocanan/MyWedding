services:
  # Backend Web Service
  - type: web
    name: wedding-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=backend
    startCommand: node apps/backend/dist/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true

  # Frontend Static Site
  - type: web
    name: wedding-frontend
    runtime: static
    buildCommand: npm install && npm run build --workspace=wedding-invitation
    staticPublishPath: apps/wedding-invitation/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: wedding-backend
          type: web
          property: host
